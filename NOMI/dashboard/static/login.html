<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NOMI — Sign in</title>
<style>
:root{--bg:#03070d;--panel:#0a1626;--line:#16324d;--line2:#2a6aa3;--fg:#dceeff;--muted:#6f8aa6;--accent:#4fb3ff;--warn:#ff7b6b;--ink:#04121f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(700px 500px at 50% 35%,#071629,var(--bg) 70%);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px 16px}
.card{width:min(360px,100%);background:var(--panel);border:1px solid var(--line2);padding:28px 22px;position:relative}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--accent)}
.card::before{left:-2px;top:-2px;border-right:0;border-bottom:0}.card::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
h1{margin:0;font-size:28px;letter-spacing:.06em;display:flex;gap:10px;align-items:center}
h1 span{color:var(--accent);font-weight:400;font-size:18px}
p{color:var(--muted);margin:6px 0 22px;font-size:14px}
label{display:block;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
input{width:100%;background:#02060c;border:1.5px solid var(--line2);color:var(--fg);font:600 30px ui-monospace,Menlo,monospace;letter-spacing:.4em;text-align:center;padding:12px 8px}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:14px;background:var(--accent);color:var(--ink);border:0;font:700 14px ui-monospace,Menlo,monospace;letter-spacing:.12em;padding:13px}
button:disabled{opacity:.5}
.err{color:var(--warn);font-size:14px;min-height:22px;margin-top:10px}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>⬡ NOMI <span>Agentic OS</span></h1>
  <p>Enter the access code shown on your computer in NOMI → Settings → Phone dashboard.</p>
  <label for="code">ACCESS CODE</label>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required autofocus>
  <button id="go" type="submit">CONNECT</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const f = document.getElementById("f"), code = document.getElementById("code"), err = document.getElementById("err"), go = document.getElementById("go");
code.addEventListener("input", () => { code.value = code.value.replace(/\D/g, "").slice(0, 6); err.textContent = ""; });
f.addEventListener("submit", async e => {
  e.preventDefault();
  go.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code.value }) });
    const d = await r.json();
    if (d.ok) location.href = "/"; else { err.textContent = d.error || "Couldn't sign in."; code.select(); }
  } catch { err.textContent = "Can't reach NOMI. Is it still running on your computer?"; }
  go.disabled = false;
});
</script>
</body>
</html>
